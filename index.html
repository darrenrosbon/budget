<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1514">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0e1514;--card:#17201f;--ink:#e8efed;--mute:#8da09c;--line:#26322f;
  --acc:#2bb3a5;--acc-ink:#042220;--neg:#ff7a68;--pos:#4fd1c3;--warn-bg:#3a2f0e;--warn-ink:#f2d27a;
  --nav-h:62px;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 30px)}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 6px}
header h1{margin:0;font-size:1.3rem;font-weight:750;letter-spacing:-.01em}
main{padding:6px 16px 0;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
.hero .lbl{color:var(--mute);font-size:.85rem}
.big{font-size:2.3rem;font-weight:750;letter-spacing:-.02em;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.neg{color:var(--neg)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.over i{background:var(--neg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.two span{display:block;color:var(--mute);font-size:.8rem}
.two b{font-variant-numeric:tabular-nums}
h3{margin:18px 4px 6px;font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
button.row{cursor:pointer}
.row:first-child{border-top:0}
.row .l{min-width:0}
.row .l b{display:block;font-weight:600}
.row .l small,.mute{color:var(--mute)}
.row .l small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .r small{display:block;color:var(--mute)}
.pos{color:var(--pos)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.9rem}
.empty{text-align:center;color:var(--mute);padding:22px 10px}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.danger{color:var(--neg)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{font-size:.72rem;background:var(--line);padding:2px 8px;border-radius:99px;color:var(--mute);margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--mute);cursor:pointer}
nav button.on{color:var(--acc);font-weight:700}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet-body{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet-body h2{margin:0 0 12px;font-size:1.2rem}
form label{display:block;font-size:.8rem;color:var(--mute);margin:10px 0 0}
form input,form select{display:block;width:100%;height:48px;margin-top:4px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.inl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><h1 id="title">Budget</h1></header>
<main id="app"></main>
<nav>
  <button data-a="tab" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</button>
  <button data-a="tab" data-t="income"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>Income</button>
  <button data-a="tab" data-t="expenses"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Expenses</button>
  <button data-a="tab" data-t="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</button>
</nav>
<div id="sheet" data-a="backdrop"><div id="sheet-body"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

const fmtCache = {};
function fmt(n, cur) {
  cur = cur || S.spendCur;
  try {
    const f = fmtCache[cur] || (fmtCache[cur] = new Intl.NumberFormat(undefined, {style: 'currency', currency: cur, currencyDisplay: cur === 'ZAR' ? 'narrowSymbol' : 'symbol'}));
    return f.format(n);
  } catch { return cur + ' ' + n.toFixed(2); }
}

/* ---------- state ---------- */
const KEY = 'budget-v2';
const DEF = () => ({spendCur: 'ZAR', age: 0, rates: null, lastBackup: null, created: Date.now(), jobs: [], expenses: []});
function load() { try { return Object.assign(DEF(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch { return DEF(); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast('Could not save – storage is full or blocked'); } }
let S = load();
let tab = 'home';
let missing = false;

/* ---------- currency ---------- */
const COMMON = ['ZAR', 'USD', 'EUR', 'GBP', 'AUD', 'CAD', 'NZD', 'CHF', 'JPY', 'INR'];
function curOpts(sel) {
  const set = new Set([...COMMON, S.spendCur, sel, ...S.jobs.map(j => j.cur), ...S.expenses.map(x => x.cur)]);
  if (S.rates) Object.keys(S.rates.r).forEach(c => set.add(c));
  return [...set].sort().map(c => `<option ${c === sel ? 'selected' : ''}>${c}</option>`).join('');
}
function conv(a, from, to) {
  if (from === to) return a;
  const r = S.rates && S.rates.r;
  if (!r || !r[from] || !r[to]) return null;
  return a / r[from] * r[to];
}
function toSpend(a, cur) { const v = conv(a, cur, S.spendCur); if (v === null) { missing = true; return 0; } return v; }

async function refreshRates(force) {
  const today = todayStr();
  if (!force && S.rates && S.rates.date === today) return;
  try {
    let r, src;
    try {
      const j = await (await fetch('https://open.er-api.com/v6/latest/USD')).json();
      if (j.result !== 'success') throw 0;
      r = j.rates; src = 'open.er-api.com';
    } catch {
      const j = await (await fetch('https://api.frankfurter.dev/v1/latest?base=USD')).json();
      r = Object.assign({USD: 1}, j.rates); src = 'frankfurter.dev';
    }
    S.rates = {date: today, ts: Date.now(), r, src};
    save(); render();
    if (force) toast('Exchange rates updated');
  } catch {
    if (force) toast('Could not fetch rates – are you offline?');
  }
}

/* ---------- maths (everything per month) ---------- */
const WEEKS = 52 / 12;
const FREQ = {weekly: WEEKS, monthly: 1, yearly: 1 / 12};
const FREQ_LABEL = {weekly: 'week', monthly: 'month', yearly: 'year'};
function jobGross(j) {                       // gross per month, in the job's currency
  if (j.type === 'hourly') return j.rate * j.hours * WEEKS;
  if (j.type === 'weekly') return j.rate * WEEKS;
  return j.rate;
}

/* South African income tax (SARS). Keyed by the year the tax year STARTS (1 March).
   brackets: [taxable income above, base tax, rate]; rebate: [primary, secondary 65+, tertiary 75+] */
const SA_TAX = {
  2025: {label: '2025/26', rebate: [17235, 9444, 3145], brackets: [[0, 0, .18], [237100, 42678, .26], [370500, 77362, .31], [512800, 121475, .36], [673000, 179147, .39], [857900, 251258, .41], [1817000, 644489, .45]]},
  2026: {label: '2026/27', rebate: [17820, 9765, 3249], brackets: [[0, 0, .18], [245100, 44118, .26], [383100, 79998, .31], [530200, 125599, .36], [695800, 185215, .39], [887000, 259783, .41], [1878600, 666339, .45]]}
};
function saTable(date = new Date()) {                       // auto-pick the tax year from today's date
  const start = date.getMonth() >= 2 ? date.getFullYear() : date.getFullYear() - 1;
  const keys = Object.keys(SA_TAX).map(Number).sort((a, b) => a - b);
  const k = keys.filter(x => x <= start).pop() ?? keys[0];  // newest table we have, if the year is newer
  return SA_TAX[k];
}
function saTax(annual, age) {                                // annual tax in ZAR after rebates
  const t = saTable();
  let b = t.brackets[0];
  for (const x of t.brackets) if (annual > x[0]) b = x;
  const tax = b[1] + Math.max(0, annual - b[0]) * b[2];
  const rebate = t.rebate[0] + (age >= 65 ? t.rebate[1] : 0) + (age >= 75 ? t.rebate[2] : 0);
  return Math.max(0, tax - rebate);
}

function stats() {
  missing = false;
  const jobs = S.jobs.map(j => {
    const g = jobGross(j);
    const z = conv(g, j.cur, 'ZAR');
    if (z === null) missing = true;
    return {j, g, gs: toSpend(g, j.cur), gz: z ?? 0};
  });
  const exps = S.expenses.map(x => {
    const m = x.amt * FREQ[x.freq];
    return {x, m, ms: toSpend(m, x.cur)};
  });
  const gross = jobs.reduce((s, a) => s + a.gs, 0);
  const grossZ = jobs.reduce((s, a) => s + a.gz, 0);
  const taxZ = saTax(grossZ * 12, +S.age) / 12;             // tax is worked out on ALL jobs combined
  let tax = conv(taxZ, 'ZAR', S.spendCur);
  if (tax === null) { missing = true; tax = 0; }
  const inc = gross - tax;
  const spend = exps.reduce((s, a) => s + a.ms, 0);
  return {jobs, exps, gross, tax, rate: gross > 0 ? tax / gross * 100 : 0, inc, spend, left: inc - spend, missing, year: saTable().label};
}

/* ---------- views ---------- */
const RATE_WARN = `<div class="warn">Some amounts can't be converted yet because exchange rates haven't loaded. Connect to the internet, then open Settings and tap “Refresh rates”.</div>`;

function vHome() {
  const st = stats();
  const pct = st.inc > 0 ? Math.min(100, st.spend / st.inc * 100) : (st.spend > 0 ? 100 : 0);
  let h = st.missing ? RATE_WARN : '';
  if (S.jobs.length || S.expenses.length) {
    const days = (Date.now() - (S.lastBackup || S.created || Date.now())) / 864e5;
    if (days > 30) h += `<div class="warn">${S.lastBackup ? 'It has been over a month since your last backup.' : 'You have not backed up your data yet.'} Your data only lives on this phone – open Settings and tap “Export backup”.</div>`;
  }
  h += `<section class="card hero"><div class="lbl">Left over each month</div>
    <div class="big ${st.left < 0 ? 'neg' : 'pos'}">${fmt(st.left)}</div>
    <div class="bar ${st.spend > st.inc ? 'over' : ''}"><i style="width:${pct}%"></i></div>
    <div class="two"><div><span>Income (after tax)</span><b>${fmt(st.inc)}</b></div><div><span>Expenses</span><b class="neg">${fmt(st.spend)}</b></div></div>
    <div class="kv" style="margin-top:12px"><span>Left over per year</span><b class="${st.left < 0 ? 'neg' : ''}">${fmt(st.left * 12)}</b></div>
    <div class="kv"><span>Income before tax</span><span>${fmt(st.gross)}</span></div>
    <div class="kv"><span>Tax (SA ${st.year})</span><span>−${fmt(st.tax)}</span></div></section>`;
  h += `<h3>Income</h3>`;
  if (!st.jobs.length) h += `<div class="empty">No income yet.<br><button class="btn pri sm" style="margin-top:10px" data-a="addJob">+ Add a job</button></div>`;
  else h += `<section class="card" style="padding:4px 16px">` + st.jobs.map(a =>
    `<button class="row" data-a="editJob" data-id="${a.j.id}"><div class="l"><b>${esc(a.j.name)}</b><small>before tax</small></div>
     <div class="r pos">${fmt(a.gs)}${a.j.cur !== S.spendCur ? `<small>${fmt(a.g, a.j.cur)}</small>` : ''}</div></button>`).join('') + `</section>`;
  h += `<h3>Expenses</h3>`;
  if (!st.exps.length) h += `<div class="empty">No expenses yet.<br><button class="btn pri sm" style="margin-top:10px" data-a="addExp">+ Add an expense</button></div>`;
  else h += `<section class="card" style="padding:4px 16px">` + st.exps.map(a =>
    `<button class="row" data-a="editExp" data-id="${a.x.id}"><div class="l"><b>${esc(a.x.name)}</b></div><div class="r neg">${fmt(a.ms)}</div></button>`).join('') + `</section>`;
  return h;
}

function vIncome() {
  const st = stats();
  let h = st.missing ? RATE_WARN : '';
  h += `<section class="card hero"><div class="lbl">Income per month after tax · ${esc(S.spendCur)}</div><div class="big">${fmt(st.inc)}</div>
    <div class="kv"><span>Before tax</span><span>${fmt(st.gross)}</span></div>
    <div class="kv"><span>Tax (SA ${st.year})</span><span>−${fmt(st.tax)}</span></div>
    <div class="kv"><span>Average tax rate</span><span>${st.rate.toFixed(1)}%</span></div></section>`;
  if (!S.jobs.length) h += `<div class="empty">No jobs yet. Add one to count its income.</div>`;
  st.jobs.forEach(({j, g, gs}) => {
    const rateTxt = j.type === 'hourly' ? `${fmt(j.rate, j.cur)} / hour × ${+j.hours} hours / week` : `${fmt(j.rate, j.cur)} / ${j.type === 'weekly' ? 'week' : 'month'}`;
    h += `<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:1.1rem">${esc(j.name)}</b><span class="badge">${j.type}</span></div>
      <div class="mute" style="font-size:.9rem;margin-bottom:8px">${rateTxt} · ${esc(j.cur)}</div>
      <div class="kv"><span>Per month before tax</span><b>${fmt(g, j.cur)}</b></div>
      ${j.cur !== S.spendCur ? `<div class="kv"><span>In ${esc(S.spendCur)}</span><b class="pos">${fmt(gs)}</b></div>` : ''}
      <div class="actions"><button class="btn sm" data-a="editJob" data-id="${j.id}">Edit</button></div></section>`;
  });
  h += `<button class="btn pri block" data-a="addJob">+ Add job</button>
    <p class="mute" style="font-size:.8rem">Tax is an estimate using SARS ${st.year} rates on all your jobs combined, with the age rebate from Settings. It leaves out UIF, medical credits, retirement contributions and other deductions.</p>`;
  const others = [...new Set(S.jobs.map(j => j.cur))].filter(c => c !== S.spendCur);
  if (others.length && S.rates) h += `<p class="mute" style="font-size:.8rem;text-align:center">` + others.map(c => `1 ${c} = ${fmt(conv(1, c, S.spendCur) ?? 0)}`).join(' · ') + `<br>Rates updated ${esc(S.rates.date)}</p>`;
  return h;
}

function vExpenses() {
  const st = stats();
  let h = st.missing ? RATE_WARN : '';
  h += `<section class="card hero"><div class="lbl">Expenses per month · ${esc(S.spendCur)}</div><div class="big neg">${fmt(st.spend)}</div>
    <div class="kv"><span>Per year</span><span class="neg">${fmt(st.spend * 12)}</span></div></section>`;
  if (!st.exps.length) h += `<div class="empty">No expenses yet. Add rent, food, subscriptions…</div>`;
  else h += `<section class="card" style="padding:4px 16px">` + [...st.exps].sort((a, b) => b.ms - a.ms).map(a => {
    const x = a.x, orig = x.cur !== S.spendCur || x.freq !== 'monthly';
    return `<button class="row" data-a="editExp" data-id="${x.id}"><div class="l"><b>${esc(x.name)}</b>${orig ? `<small>${fmt(x.amt, x.cur)} / ${FREQ_LABEL[x.freq]}</small>` : ''}</div>
      <div class="r neg">${fmt(a.ms)}<small>/ month</small></div></button>`;
  }).join('') + `</section>`;
  return h + `<button class="btn pri block" data-a="addExp">+ Add expense</button>`;
}

function vSettings() {
  const r = S.rates;
  return `<h3>Expenses currency</h3><section class="card">
    <form onsubmit="return false"><label>Show expenses and what's left over in
    <select data-c="spendCur">${curOpts(S.spendCur)}</select></label></form>
    <p class="mute" style="font-size:.85rem;margin:10px 0 0">Job income keeps its own currency and is converted to this one.</p></section>
    <h3>South African tax</h3><section class="card">
    <form onsubmit="return false"><label>Your age (sets the tax rebate)
    <select data-c="age">${[[0, 'Under 65'], [65, '65 to 74'], [75, '75 or older']].map(([v, t]) => `<option value="${v}" ${+S.age === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label></form>
    <div class="kv" style="margin-top:10px"><span>Tax year in use</span><span>${saTable().label}</span></div>
    <p class="mute" style="font-size:.85rem;margin:6px 0 0">The tax year is picked automatically from today's date (it changes on 1 March). Your income is converted to rand and taxed on the combined total of all jobs.</p></section>
    <h3>Exchange rates</h3><section class="card">
    <div class="kv"><span>Last updated</span><span>${r ? esc(r.date) : 'never'}</span></div>
    <div class="kv"><span>Source</span><span>${r ? esc(r.src) : '–'}</span></div>
    ${r && r.r[S.spendCur] ? `<div class="kv"><span>1 USD</span><span>${fmt(conv(1, 'USD', S.spendCur) ?? 0)}</span></div>` : ''}
    <p class="mute" style="font-size:.85rem">Rates refresh automatically the first time you open the app each day.</p>
    <button class="btn block" data-a="rates">Refresh rates now</button></section>
    <h3>Your data</h3><section class="card">
    <p class="mute" style="font-size:.85rem;margin-top:0">Everything is stored only in this browser on this device. Last backup: ${S.lastBackup ? new Date(S.lastBackup).toLocaleDateString() : 'never'}.</p>
    <div class="actions" style="margin-top:0"><button class="btn" data-a="export">Export backup</button><button class="btn" data-a="import">Import backup</button><button class="btn danger" data-a="erase">Erase all</button></div>
    <input type="file" id="file" accept="application/json,.json" hidden></section>`;
}

const TITLES = {home: 'Budget', income: 'Income', expenses: 'Expenses', settings: 'Settings'};
function render() {
  const views = {home: vHome, income: vIncome, expenses: vExpenses, settings: vSettings};
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#title').textContent = TITLES[tab];
  $('#app').innerHTML = views[tab]();
}

/* ---------- sheets ---------- */
function openSheet(html) { $('#sheet-body').innerHTML = html; $('#sheet').classList.add('open'); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet-body').innerHTML = ''; }
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }
const delBtn = (a, id) => `<button type="button" class="btn danger" data-a="${a}" data-id="${id}">Delete</button>`;

function jobSheet(j) {
  const isNew = !j;
  j = j || {name: '', cur: 'USD', type: 'hourly', rate: '', hours: ''};
  const lbl = {hourly: 'Hourly rate (before tax)', weekly: 'Pay per week (before tax)', monthly: 'Pay per month (before tax)'};
  openSheet(`<h2>${isNew ? 'Add job' : 'Edit job'}</h2>
    <form id="jobf" data-id="${esc(j.id || '')}">
    <label>Job name<input name="name" required maxlength="40" value="${esc(j.name)}"></label>
    <div class="inl"><label>Paid<select name="type" id="jtype">${['hourly', 'weekly', 'monthly'].map(t => `<option value="${t}" ${t === j.type ? 'selected' : ''}>${t[0].toUpperCase() + t.slice(1)}</option>`).join('')}</select></label>
    <label>Currency<select name="cur">${curOpts(j.cur)}</select></label></div>
    <label><span id="jlabel">${lbl[j.type]}</span><input name="rate" type="number" inputmode="decimal" step="any" min="0" required value="${esc(j.rate)}"></label>
    <label id="hrow" ${j.type === 'hourly' ? '' : 'hidden'}>Hours per week<input name="hours" type="number" inputmode="decimal" step="any" min="0" max="168" value="${esc(j.hours)}"></label>
    <div class="actions"><button class="btn pri" style="flex:1">Save</button><button type="button" class="btn" data-a="close">Cancel</button>${isNew ? '' : delBtn('delJob', j.id)}</div></form>`);
  $('#jtype').addEventListener('change', e => {
    $('#jlabel').textContent = lbl[e.target.value];
    $('#hrow').hidden = e.target.value !== 'hourly';
  });
}

function expSheet(x) {
  const isNew = !x;
  x = x || {name: '', amt: '', cur: S.spendCur, freq: 'monthly'};
  openSheet(`<h2>${isNew ? 'Add expense' : 'Edit expense'}</h2>
    <form id="expf" data-id="${esc(x.id || '')}">
    <label>Name<input name="name" required maxlength="40" value="${esc(x.name)}" placeholder="e.g. Rent"></label>
    <div class="inl"><label>Amount<input name="amt" type="number" inputmode="decimal" step="any" min="0" required value="${esc(x.amt)}"></label>
    <label>Currency<select name="cur">${curOpts(x.cur)}</select></label></div>
    <label>How often<select name="freq">${Object.keys(FREQ).map(f => `<option value="${f}" ${f === x.freq ? 'selected' : ''}>Every ${FREQ_LABEL[f]}</option>`).join('')}</select></label>
    <div class="actions"><button class="btn pri" style="flex:1">Save</button><button type="button" class="btn" data-a="close">Cancel</button>${isNew ? '' : delBtn('delExp', x.id)}</div></form>`);
}

/* ---------- actions ---------- */
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const A = {
  tab: d => { tab = d.t; render(); window.scrollTo(0, 0); },
  addJob: () => jobSheet(),
  editJob: d => jobSheet(S.jobs.find(j => j.id === d.id)),
  delJob: d => { if (confirm('Delete this job?')) { S.jobs = S.jobs.filter(j => j.id !== d.id); save(); closeSheet(); render(); } },
  addExp: () => expSheet(),
  editExp: d => expSheet(S.expenses.find(x => x.id === d.id)),
  delExp: d => { if (confirm('Delete this expense?')) { S.expenses = S.expenses.filter(x => x.id !== d.id); save(); closeSheet(); render(); } },
  close: closeSheet,
  backdrop: (d, e) => { if (e.target.id === 'sheet') closeSheet(); },
  rates: () => refreshRates(true),
  export: () => { download(`budget-backup-${todayStr()}.json`, JSON.stringify(S, null, 2)); S.lastBackup = Date.now(); save(); render(); },
  import: () => $('#file').click(),
  erase: () => { if (confirm('Erase ALL data on this device? This cannot be undone.') && confirm('Really erase everything?')) { const rates = S.rates; S = DEF(); S.rates = rates; save(); render(); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) A[el.dataset.a](el.dataset, e);
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fd = Object.fromEntries(new FormData(f));
  const put = (list, rec) => { const i = list.findIndex(r => r.id === rec.id); if (i >= 0) list[i] = rec; else list.push(rec); };
  if (f.id === 'jobf') {
    const rec = {id: f.dataset.id || uid(), name: fd.name.trim(), cur: fd.cur, type: fd.type, rate: num(fd.rate),
      hours: fd.type === 'hourly' ? num(fd.hours) : 0};
    if (rec.type === 'hourly' && !(rec.hours > 0)) return toast('Enter the hours per week');
    put(S.jobs, rec); save(); closeSheet(); render();
  } else if (f.id === 'expf') {
    const amt = num(fd.amt);
    if (!(amt > 0)) return toast('Enter an amount above 0');
    put(S.expenses, {id: f.dataset.id || uid(), name: fd.name.trim(), amt, cur: fd.cur, freq: fd.freq});
    save(); closeSheet(); render();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.c === 'age') {
    S.age = +t.value; save(); render();
  } else if (t.dataset.c === 'spendCur') {
    S.spendCur = t.value; save(); render(); toast(`Now showing ${t.value}`);
  } else if (t.id === 'file' && t.files[0]) {
    t.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.jobs) || !Array.isArray(d.expenses)) throw 0;
      if (!confirm('Replace everything on this device with the backup?')) return;
      S = Object.assign(DEF(), d); save(); render(); toast('Backup imported');
    }).catch(() => toast('That file is not a valid backup'));
  }
});

/* ---------- start ---------- */
render();
refreshRates(false);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
